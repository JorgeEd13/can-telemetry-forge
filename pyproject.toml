[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "can-telemetry-forge"
version = "0.2.0"
description = "Synthetic heavy-equipment CAN Bus telemetry generator (SAE J1939 + physics) for predictive-maintenance datasets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jorge Ribeiro" }]
keywords = [
    "synthetic-data",
    "telemetry",
    "can-bus",
    "j1939",
    "predictive-maintenance",
    "data-generation",
    "fleet",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "duckdb>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.16", "mypy>=1.14"]
# Validation-only — distribution checks against a license-checked public dataset
# (ROADMAP F4 / ADR-017). Kept out of the core runtime deps so the library + CI
# stay lean. The opt-in ``--dataset ved`` fetch downloads via the classic Kaggle REST
# endpoint with HTTP Basic auth from ``~/.kaggle/kaggle.json`` (the bundled SDKs route
# through api.kaggle.com and can 403 behind TLS-inspecting proxies), so it needs only
# ``requests``. The offline adapters (in_spec, golden) need nothing beyond the core.
validate = ["requests>=2.28", "matplotlib>=3.7"]

[project.scripts]
forge = "can_telemetry_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# "src" for the installable package; "." so the opt-in ``validation/`` package
# (deliberately outside src/ — the core never imports it) is importable in tests.
pythonpath = ["src", "."]
testpaths = ["tests"]

# --------------------------------------------------------------------------- #
# Static analysis. Enforced in CI — see .github/workflows/ci.yml.
# The rule set is curated rather than "ALL": every rule here is one the repo
# actually passes, so a red gate always means a new defect, never a backlog.
# Widening the set is a deliberate change, not a wish (see docs/DECISIONS.md).
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RET", "PIE", "RUF"]
ignore = [
    "RUF001",  # ambiguous unicode in strings — the reports use box-drawing glyphs
    "RUF002",
    "RUF003",
    "SIM108",  # ternary is not always more readable than if/else
    # E501 is deliberately OFF. `ruff format` is NOT enforced here: reformatting
    # ~33k lines would rewrite history for `git blame`, and the commit log is a
    # working engineering record. Without a formatter, line length is the least
    # informative rule in the set, and every real violation left is an embedded
    # CSS/JS block, a base64 asset or a test fixture — none of which read better
    # wrapped. The rules that catch defects (F, B, UP, SIM, RET, C4, RUF) stay on.
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["can_telemetry_forge"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
# Ratchet, not a wall: these are the levels the code passes TODAY and CI holds.
# Tightening happens per-module (see [[tool.mypy.overrides]]) so the gate stays
# green and every step forward is a real, reviewed change.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true
