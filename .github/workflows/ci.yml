name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:

  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (package + dev extras)
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      # The gate is deliberately a separate job from the test matrix: it runs
      # once, not per OS/version, and a lint failure names itself in the run list
      # instead of hiding inside a matrix cell.
      - name: ruff
        run: python -m ruff check .

      - name: mypy
        run: python -m mypy
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (with dev extras)
        run: python -m pip install -e .[dev]

      - name: forge --version
        run: forge --version

      - name: Run tests (offline)
        run: python -m pytest -q
